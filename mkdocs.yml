site_name: RIBLL 2026
site_url: https://sitename.example
theme:
  name: material
  language: zh
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
     # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
  font:
    text: "Noto Sans SC, Merriweather Sans"
    code: Fira Code

  icon:
    logo: octicons/zap-24
  features:
    - content.code.copy
    - navigation.expand
    - navigation.footer  

  

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


nav:
  - 简介: index.md
  - 实验设置:
    - 探测器阵列设置: introduction/tele.md
  - 分析代码结构:
    - forgerib: code/forgerib/forgerib.md
  - T0初步分析:
    - T0D1: T0/t0d1.md

# 新增 plugins 块来优化搜索
plugins:
  - search:
      separator: '[\s\-\.]+'
      suggestions: true      # <--- 启用搜索建议
      highlight: true        # <--- 启用搜索词高亮
      lang: zh
      separator: '[\s\u200b\-]'  # 这一行让搜索可以更好地匹配词语[citation:1]
      prebuild_index: true
      # 通过设置最小长度来确保短词不被忽略
      min_search_length: 2
  
  - git-revision-date-localized:  # <--- 新增：显示最后更新日期
      type: date

# 在 extra 中添加版本和生成器信息
extra:
  version:
    provider: mike
    default: latest
    generator: false  # <--- 移除页脚的 "Made with Material for MkDocs" 信息

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hjlfsj

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js